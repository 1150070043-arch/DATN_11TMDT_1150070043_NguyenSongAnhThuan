# Local TLS evidence; combine with the audit overlay while testing.
# API/web stay on the isolated secure network. Only Caddy terminates TLS.
services:
  api-secure:
    environment:
      WEB_ORIGIN: https://localhost:8443
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: 1
      VNPAY_RETURN_URL: https://localhost:8443/api/payments/vnpay-return
  web-secure-https:
    profiles: [https]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SECURITY_MODE: secure
        VITE_API_URL: ""
        VITE_MAIL_UI_URL: http://localhost:8025
    networks: [secure]
  tls-secure:
    profiles: [https]
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/Caddyfile.lab:/etc/caddy/Caddyfile:ro
      - bookguard-lab-tls:/data
    networks: [secure]
    depends_on:
      api-secure:
        condition: service_healthy
      web-secure-https:
        condition: service_started
volumes:
  bookguard-lab-tls:

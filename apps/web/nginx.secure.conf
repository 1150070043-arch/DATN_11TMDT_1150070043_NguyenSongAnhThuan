# Keep reset/verification tokens and payment query values out of access logs.
map $request_uri $bookguard_request_path {
  ~^(?<bookguard_original_path>[^?]*) $bookguard_original_path;
  default /;
}
log_format bookguard_private '$remote_addr [$time_local] "$request_method $bookguard_request_path $server_protocol" $status $body_bytes_sent';

server {
  listen 80;
  server_name _;
  server_tokens off;
  access_log /var/log/nginx/access.log bookguard_private;
  root /usr/share/nginx/html;
  index index.html;
  etag on;
  gzip on;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  include /etc/nginx/bookguard-secure-headers.conf;

  # HTML is always refreshed so its asset hashes match the current release.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    include /etc/nginx/bookguard-secure-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # /assets is reserved for content-hashed Vite output, including cover variants.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/bookguard-secure-headers.conf;
    try_files $uri =404;
  }

  # Non-versioned public assets must revalidate after a short freshness period.
  location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|woff2)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    include /etc/nginx/bookguard-secure-headers.conf;
    try_files $uri =404;
  }
}

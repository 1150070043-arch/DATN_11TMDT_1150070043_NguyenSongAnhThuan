server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  etag on;
  gzip on;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Resolve the matching API at request time so container restarts are supported.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location ^~ /api/ {
    set $bookguard_api http://api-baseline:4001;
    proxy_pass $bookguard_api$request_uri;
    proxy_set_header Host $http_host;
  }

  # HTML is always refreshed so its asset hashes match the current release.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # /assets is reserved for content-hashed Vite output, including cover variants.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Non-versioned public assets must revalidate after a short freshness period.
  location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|woff2)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }
}
